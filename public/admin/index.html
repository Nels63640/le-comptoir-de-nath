<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Le Comptoir de Nath — Administration</title>
  </head>
  <body>
    <!-- Interface d'administration Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Boutons flottants (imprimer + telecharger la carte) : accessibles uniquement depuis l'admin -->
    <script>
      (function () {
        function fab(text, href, bottom, title) {
          var a = document.createElement("a");
          a.href = href;
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = text;
          a.title = title || "";
          a.style.cssText =
            "position:fixed;right:18px;bottom:" + bottom + ";z-index:99999;background:#159a9c;color:#fff;" +
            "font-family:system-ui,-apple-system,sans-serif;font-weight:700;font-size:14px;" +
            "padding:12px 20px;border-radius:100px;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;";
          document.body.appendChild(a);
          return a;
        }
        var b1 = fab("🖨️ Imprimer la carte", "/carte-imprimable", "18px", "Ouvrir la carte au format imprimable (A4)");
        var b2 = fab("⬇️ Télécharger la carte (PDF)", "/carte-imprimable?dl=1", "66px", "Télécharger la carte en PDF");

        // N'afficher les boutons QUE si un utilisateur est connecte (present dans le localStorage de Decap)
        function loggedIn() {
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (/(decap|netlify)-cms-user/.test(k) && localStorage.getItem(k)) return true;
            }
          } catch (e) {}
          return false;
        }
        function sync() {
          var d = loggedIn() ? "inline-block" : "none";
          b1.style.display = d;
          b2.style.display = d;
        }
        sync();
        setInterval(sync, 1000);
      })();
    </script>
  </body>
</html>
